name: Validate Agent Skill

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.x"
      - name: Scan current tree and Git history for secrets
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir . --no-banner --redact
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --no-banner --redact
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Discover skill with pinned skills CLI
        env:
          DO_NOT_TRACK: "1"
          npm_config_ignore_scripts: "true"
        run: npx --yes skills@1.5.20 add . --list
      - name: Validate Python automation
        run: |
          python -m py_compile skills/asa-pro/scripts/broad_to_exact.py
          python -m py_compile skills/asa-pro/scripts/app_store_relevance.py
          python -m unittest discover -s tests -v
      - name: Verify required package files
        run: |
          test -f skills/asa-pro/SKILL.md
          test -f README.md
          test -f SECURITY.md
          test -f skills/asa-pro/references/setup.md
          test -f skills/asa-pro/references/safety-and-troubleshooting.md
          test -f skills/asa-pro/references/competitor-relevance.md
          test -f skills/asa-pro/references/daily-dedicated-campaign-review.md
          test -f skills/asa-pro/scripts/broad_to_exact.py
          test -f skills/asa-pro/scripts/app_store_relevance.py
          test -f skills/asa-pro/templates/relevance-approvals.json
          test -f skills/asa-pro/templates/campaign-blueprint.yaml
